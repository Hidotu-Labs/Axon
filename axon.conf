# /etc/axon/axon.conf
# Axon Package Manager Configuration

[options]
RootDir = /
DBPath = /var/lib/axon
CacheDir = /var/cache/axon/pkg
SyncDir = /var/lib/axon/sync
ArchSyncDir = /var/lib/pacman/sync
MirrorList = /etc/axon/mirrorlist
Color = auto

# Custom Package Repositories (GitHub, Raw HTTP, etc.)
# Supported manifest format (pipe-delimited):
# name|version|size|url|description|[dependencies]|[sha256]

[ascension]
Server = https://raw.githubusercontent.com/Hidotu-Labs/Axon-Packages/main/packages.txt
